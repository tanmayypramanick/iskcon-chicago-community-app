<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://gkkeebhdavavizcvknwy.supabase.co; form-action 'none'; base-uri 'none'">
<!--
  The page every ISKCON Chicago auth email lands on.

  Why it is a static file
  -----------------------
  It was an edge function (supabase/functions/auth-link/index.ts, kept for its
  commentary). Supabase will not serve HTML from one: the platform overrides the
  function's content-type with text/plain and its CSP with a bare `sandbox`, as
  an anti-phishing measure on supabase.co. Verified in a browser — the raw
  markup came back as text. So the page lives on GitHub Pages instead.

  What that costs, and how each loss is answered
  ----------------------------------------------
  Pages serves files and sets no response headers, and the edge function relied
  on five.

    - CSP was a per-request nonce. A static file cannot rotate one, and
      'unsafe-inline' on a page holding a live access token is not a trade worth
      making, so the styles and the script moved into files of their own and the
      policy above is `'self'` for both. It is otherwise the header verbatim:
      connect-src is Supabase's auth origin and nothing else, so no script here
      can send a token anywhere.
    - Referrer-Policy: no-referrer -> the <meta name="referrer"> below, which
      browsers honour identically.
    - X-Frame-Options: DENY has no meta equivalent, and `frame-ancestors` is
      ignored by spec when a policy arrives in <meta>. auth-link.js refuses to
      render inside a frame instead.
    - Cache-Control: no-store cannot be set, and Pages caches this file. That is
      acceptable and is not an oversight: these bytes are the same for every
      devotee and hold no session. The tokens arrive in the URL fragment, which
      browsers never send to GitHub, never write to disk with the document, and
      which this page strips before it renders anything.
    - X-Content-Type-Options: nosniff is likewise gone, and is not missed: Pages
      serves .html as text/html, so there is no ambiguous type to sniff.
-->
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<title>ISKCON Chicago</title>
<!-- Drawn inline so there is no second request and no host for the CSP to allow. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23E8971C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,600;1,500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth-link.css">
</head>
<body>
<div class="wrap">
  <p class="eyebrow">ISKCON Chicago</p>
  <div class="card">
    <div class="rule"></div>
    <div class="body">
      <div class="mark" id="mark" hidden>
        <svg id="mark-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
      </div>
      <p class="greeting">Hare Kṛṣṇa</p>
      <h1 id="heading">One moment</h1>
      <p class="lede" id="lede">Opening your link.</p>
      <p class="detail" id="detail" hidden></p>

      <!-- Password recovery, done here in the browser. -->
      <form id="password-form" hidden autocomplete="on">
        <div class="field">
          <label for="password">New password</label>
          <input id="password" name="new-password" type="password" autocomplete="new-password" autocapitalize="none" spellcheck="false" required>
          <button type="button" class="reveal" id="reveal">Show</button>
        </div>
        <div class="field">
          <label for="confirmation">Confirm new password</label>
          <input id="confirmation" name="confirm-password" type="password" autocomplete="new-password" autocapitalize="none" spellcheck="false" required>
        </div>
        <button type="submit" class="primary" id="save">Save my new password</button>
        <p class="message" id="password-message" hidden aria-live="polite"></p>
      </form>

      <!-- Asking for a fresh link, when this one cannot be used. -->
      <form id="resend-form" hidden>
        <div class="field" id="kind-field" hidden>
          <label for="kind">What were you trying to do?</label>
          <select id="kind">
            <option value="recovery">Reset my password</option>
            <option value="signup">Confirm my email address</option>
            <option value="magiclink">Sign in with a link</option>
          </select>
        </div>
        <div class="field">
          <label for="email">Your email address</label>
          <input id="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="primary" id="send">Send me a fresh link</button>
        <p class="message" id="resend-message" hidden aria-live="polite"></p>
      </form>

      <div class="handoff" id="handoff" hidden>
        <p id="handoff-note">Have the app on this phone?</p>
        <a class="secondary" id="open-app" href="#">Open in the ISKCON Chicago app</a>
      </div>

      <p class="note" id="note" hidden></p>
      <p class="servant">Your servant,<br>ISKCON Chicago</p>
    </div>
  </div>
  <p class="mantra">Hare Kṛṣṇa Hare Kṛṣṇa &middot; Kṛṣṇa Kṛṣṇa Hare Hare<br>Hare Rāma Hare Rāma &middot; Rāma Rāma Hare Hare</p>
  <p class="footer">ISKCON Chicago &middot; <a href="mailto:tech@iskconchicago.com">tech@iskconchicago.com</a></p>
</div>
<script src="auth-link.js"></script>
</body>
</html>
